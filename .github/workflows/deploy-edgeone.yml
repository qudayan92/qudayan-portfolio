name: Deploy to EdgeOne Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Prepare deploy artifacts
        run: |
          # 复制 standalone 产物到 deploy 目录
          mkdir -p deploy
          cp -r .next/standalone/* deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public 2>/dev/null || true
          # AI 摘要 JSON（构建时已嵌入，但保留运行时访问）
          cp src/lib/ai-summaries.json deploy/src/lib/ai-summaries.json 2>/dev/null || true
          # 环境变量
          cat > deploy/.env << EOF
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          LLM_API_BASE_URL=https://apihub.agnes-ai.com/v1
          LLM_MODEL=agnes-2.5-flash
          EOF
          echo "Deploy size: $(du -sh deploy/)"

      - name: Deploy to EdgeOne Pages
        uses: TencentEdgeOne/edgeone-pages-action@v1
        with:
          token: ${{ secrets.EDGEONE_PAGES_API_TOKEN }}
          project-name: qudayan-portfolio
          build-path: './deploy'

    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}