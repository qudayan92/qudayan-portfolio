name: Deploy to Tencent CloudBase (Cloud Run)

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (with offline cache)
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Prepare deploy artifacts
        run: |
          mkdir -p deploy
          cp -r .next/standalone/* deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public 2>/dev/null || true
          # 把 ai-summaries.json 放到运行时可访问的位置
          cp src/lib/ai-summaries.json deploy/src/lib/ai-summaries.json 2>/dev/null || true
          echo "Deploy artifacts size:"
          du -sh deploy/

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login CloudBase
        run: |
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

      - name: Deploy to Cloud Run (with retries for upload timeout)
        run: |
          cd deploy
          # 重试机制：上传大文件时偶发 socket hang up
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            if tcb cloudrun deploy -s qudayan-portfolio \
              --port 3000 --force \
              -e "$TCB_ENV_ID"; then
              echo "✓ Deploy succeeded"
              break
            else
              echo "✗ Attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done

      - name: Verify deployment
        if: success()
        run: |
          sleep 15
          SERVICE_URL=$(tcb cloudrun list -e "$TCB_ENV_ID" --json 2>/dev/null | grep -oP 'https://[^"]+' | head -1)
          if [ -n "$SERVICE_URL" ]; then
            echo "✓ Service URL: $SERVICE_URL"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" "$SERVICE_URL" || echo "Service not yet ready"
          fi

    env:
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}