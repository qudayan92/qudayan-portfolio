name: Deploy to Tencent CloudBase (Cloud Run)

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # 组装 CloudBase Cloud Run 可构建目录：含 Dockerfile + 完整构建源码，
      # 排除 node_modules/.next/.git/机密文件。CloudBase 检测到 Dockerfile 会走容器模式。
      - name: Prepare deploy artifacts
        run: |
          node scripts/prepare-cloudrun.mjs

      # 写入运行时环境变量（Docker 构建时注入，AI 功能需要）
      - name: Write runtime env
        run: |
          mkdir -p deploy
          cat >> deploy/.env << EOF
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          LLM_API_BASE_URL=https://apihub.agnes-ai.com/v1
          LLM_MODEL=agnes-2.5-flash
          EOF

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login CloudBase
        run: |
          tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

      # 源码部署到 Cloud Run（云端用 deploy/Dockerfile 构建），带重试
      - name: Deploy to Cloud Run
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            if tcb cloudrun deploy -s qudayan-portfolio \
              --port 3000 --force --source deploy \
              -e "$TCB_ENV_ID"; then
              echo "✓ Deploy succeeded"
              break
            else
              echo "✗ Attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done

      - name: Verify deployment
        if: success()
        run: |
          sleep 25
          URL=$(tcb cloudrun list -e "$TCB_ENV_ID" --json 2>/dev/null | grep -oP 'https://[^"]+' | head -1)
          if [ -n "$URL" ]; then
            echo "✓ Service URL: $URL"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 30 "$URL" || echo "Service not yet ready"
          else
            echo "未获取到服务 URL，稍后可手动确认"
          fi

    env:
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
