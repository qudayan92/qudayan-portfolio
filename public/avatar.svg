<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#161b2d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="qFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- 网格 -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
  </g>

  <!-- 外圈 -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.6"/>

  <!-- 内圆背景 -->
  <circle cx="200" cy="200" r="135" fill="#05060a"/>

  <!-- 大写 Q（带高光）-->
  <g filter="url(#glow)">
    <!-- 圆环 -->
    <circle cx="200" cy="200" r="78" fill="none" stroke="url(#qFill)" stroke-width="14" stroke-linecap="round"/>
    <!-- 尾巴（产品经理的"决策"象征：从圆环伸出的笔触）-->
    <line x1="252" y1="252" x2="290" y2="290" stroke="url(#qFill)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- 顶部光点 -->
  <circle cx="200" cy="65" r="3" fill="#22d3ee" opacity="0.9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 底部装饰：像素光标（左下角） -->
  <g transform="translate(60, 320)" opacity="0.8">
    <rect x="0" y="0" width="6" height="14" fill="#a5f3fc"/>
    <rect x="0" y="0" width="14" height="6" fill="#a5f3fc"/>
  </g>

  <!-- 底部装饰：dots（右下角） -->
  <g transform="translate(310, 320)" opacity="0.8">
    <circle cx="0" cy="6" r="2.5" fill="#a78bfa"/>
    <circle cx="10" cy="6" r="2.5" fill="#a78bfa" opacity="0.6"/>
    <circle cx="20" cy="6" r="2.5" fill="#a78bfa" opacity="0.3"/>
  </g>
</svg>